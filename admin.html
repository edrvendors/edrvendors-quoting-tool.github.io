<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Vendor Quote Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="role-admin">
<div class="wrap">

  <div class="topbar">
    <a href="index.html" class="back-link">← All tools</a>
    <span class="role-badge">Admin</span>
  </div>

  <h1 class="page-title">Vendor lookup</h1>
  <p class="page-sub">Search by city or vendor name to see the real vendor data behind the quotes — raw price, real tonnage, fees, and overage rates.</p>

  <div class="panel">
    <div class="field-grid">
      <div class="field">
        <label for="city">City, ST</label>
        <input id="city" type="text" placeholder="e.g. Fairhope, AL">
      </div>
      <div class="field">
        <label for="vendor">Vendor name</label>
        <input id="vendor" type="text" placeholder="e.g. Big Red">
      </div>
    </div>
    <button class="btn" id="search-btn" type="button">Search →</button>
  </div>

  <div class="results-heading">Results</div>
  <div id="results"></div>

  <p class="note">Running on the sample vendor list while the full spreadsheet is finished.</p>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
